<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Barket - Solutions Repas & Kiosque Connecté B2B Quimper</title>
    <style>
        :root {
            --primary: #1845AD;
            --primary-light: #6A7EB8;
            --primary-dark: #0D235C;
            --accent: #E65100;
            --light-bg: #F4F6FB;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text);
            line-height: 1.6;
            background-color: #ffffff;
        }

        header {
            position: sticky;
            top: 0;
            background: #ffffff;
            box-shadow: 0 2px 10px rgba(24, 69, 173, 0.12);
            z-index: 1000;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 18px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            transition: color 0.3s;
            font-size: 0.9rem;
        }

        nav a:hover {
            color: var(--primary-light);
        }

        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 90px 5% 70px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.6rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto 30px;
            opacity: 0.95;
            color: #E8EEFF;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #d84315;
        }

        section {
            padding: 70px 5%;
        }

        .section-title {
            text-align: center;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 2.2rem;
        }

        .section-subtitle {
            text-align: center;
            color: var(--primary-light);
            margin-bottom: 50px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--light-bg);
            padding: 35px;
            border-radius: 12px;
            border-top: 4px solid var(--primary);
            box-shadow: 0 4px 10px rgba(24, 69, 173, 0.05);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.3rem;
