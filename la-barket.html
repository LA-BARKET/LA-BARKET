    <!-- Paramètres PWA & Icône tactile avec logo1.png -->
    <link rel="canonical" href="https://la-barket.github.io/LA-BARKET/la-barket.html">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary: #052408;
            --primary-light: #0D4712;
            --accent: #E65100;
            --secondary: #1E293B;
            --bg-color: #EDF3ED;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #475569;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --shadow-subtle: 0 10px 25px -5px rgba(5, 36, 8, 0.12);
            --shadow-hover: 0 18px 35px -8px rgba(5, 36, 8, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .top-bar {
            background: var(--secondary);
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: var(--primary-light);
        }

        header {
            background: linear-gradient(135deg, #052408 0%, #0D4712 100%);
            color: white;
            text-align: center;
            padding: 3.5rem 1.5rem 4.5rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: var(--bg-color);
            border-radius: 35px 35px 0 0;
        }

        .header-logo {
            width: 240px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 18px auto;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 800;
        }

        header p {
            margin-top: 0.8rem;
            font-size: 1.2rem;
            color: #C8E6C9;
        }

        main {
            max-width: 1200px;
            margin: -25px auto 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 2;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-subtle);
            padding: 24px;
            border: 1px solid #81C784;
        }

        .card h3 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.3rem;
        }

        .card p {
            color: var(--text-muted);
            margin-bottom: 0;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin: 40px 0;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            overflow: hidden; 
            box-shadow: var(--shadow-subtle);
            border: 2px solid #052408;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* PRESENTATION (HAUT) */
        .presentation-grid .image-wrapper {
            width: 100%;
            height: 260px;
            background: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
        }

        .presentation-grid .photo-card img.main-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* RECETTES (BAS) */
        .recipe-grid .image-wrapper {
            width: 100%;
            height: 260px;
            background: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 10px 10px 12px;
            position: relative;
        }

        .recipe-grid .photo-card img.main-img {
            max-width: 78%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0;
        }

        /* LAURIER */
        .leaf-deco {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0px;
            width: 70px;
            height: 100%;
            object-fit: fill;
            z-index: 10;
            pointer-events: none;
            opacity: 0.98;
            filter: drop-shadow(-2px 0 4px rgba(0,0,0,0.12));
        }

        .photo-info {
            padding: 14px 16px;
            text-align: center;
            font-weight: 700;
            color: var(--secondary);
            background: #F0F7F0;
            border-top: 2px solid #052408;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 6;
        }

        /* Style pour logo.png dans les titres de recettes : poussé à droite */
        .recipe-grid .photo-info img.recipe-logo-icon {
            height: 38px;
            width: auto;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
            margin-left: auto;
        }

        .boutique-text-section {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 35px 30px;
            box-shadow: var(--shadow-subtle);
            margin: 40px 0;
            border: 2px solid #052408;
            text-align: center
