    <style>
        :root {
            --primary: #052408;
            --primary-light: #0D4712;

            --card-bg: #FFFFFF;

            --text-muted: #475569;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --shadow-subtle: 0 10px 25px -5px rgba(5, 36, 8, 0.12);
            --shadow-hover: 0 18px 35px -8px rgba(5, 36, 8, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .top-bar {
            background: var(--secondary);
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: var(--primary-light);
        }

        header {
            background: linear-gradient(135deg, #052408 0%, #0D4712 100%);
            color: white;
            text-align: center;
            padding: 3.5rem 1.5rem 4.5rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: var(--bg-color);
            border-radius: 35px 35px 0 0;
        }

        .header-logo {
            width: 240px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 18px auto;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 800;
        }

        header p {
            margin-top: 0.8rem;
            font-size: 1.2rem;
            color: #C8E6C9;
        }

        main {
            max-width: 1200px;
            margin: -25px auto 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 2;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
