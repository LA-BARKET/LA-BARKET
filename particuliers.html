<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Barket - Espace Particuliers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* TEST DE DEBUG */
        body { background-color: red !important; }

        :root {
            --primary: #1845AD;
            --primary-dark: #0d235c;
            --primary-light: #eef3ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-md: 0 10px 25px -5px rgba(24, 69, 173, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; text-align: center; padding: 3rem 1.5rem;
        }
        header h1 { margin: 0; font-size: 2.5rem; font-weight: 800; }
        .photo-card {
            background: var(--card-bg); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md); padding: 18px; margin: 20px auto; max-width: 400px;
            text-align: center;
        }
        .photo-card img { width: 100%; border-radius: var(--radius-md); object-fit: contain; }
    </style>
</head>
<body>

    <header>
        <h1>La Barket - Espace Particuliers</h1>
        <p>Test de design</p>
    </header>

    <main>
        <div class="photo-card">
            <img src="plat1.jpg" alt="Plat">
        </div>
    </main>

</body>
</html>
